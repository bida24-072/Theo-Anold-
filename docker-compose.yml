version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theo
      POSTGRES_PASSWORD: theo_dev_password
      POSTGRES_DB: theo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://theo:theo_dev_password@postgres:5432/theo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      ENROLLMENT_SHARED_SECRET: university-shared-secret
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  edge:
    build: ./edge
    environment:
      SERVER_URL: http://backend:8000
      GATE_ID: 1
      GATE_KIND: student_entry
      EDGE_API_KEY: edge-key-gate-1
      SYNC_INTERVAL: 5
    depends_on:
      - backend
    # Each real gate would have one edge container. Add more by copying this block.

  simulator:
    build: ./simulator
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    profiles: ["sim"]  # enable with: docker compose --profile sim up

volumes:
  pgdata:
